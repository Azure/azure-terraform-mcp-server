#################################################################################
#                               OneBranch Pipelines                             #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Retail Tasks:   https://aka.ms/obpipelines/tasks                              #
#################################################################################

# Release pipeline — manually triggered, publishes to npm.
# Set NpmPublishDryRun to false to perform a real publish.

parameters:
    - name: NpmPublishTag
      displayName: 'Tag'
      type: string
      default: 'latest'
    - name: NpmPublishDryRun
      displayName: 'Dry Run'
      type: boolean
      default: true

trigger: none
pr: none

resources:
    repositories:
        - repository: templates
          type: git
          name: OneBranch.Pipelines/GovernedTemplates
          ref: refs/heads/main
    pipelines:
        # Consumes the artifact produced by the official build pipeline
        - pipeline: officialBuild
          project: internal
          source: terraform-mcp-server.official
          branch: main

extends:
    template: v2/OneBranch.Official.CrossPlat.yml@templates
    parameters:
        stages:
            - stage: ESRP_Release_Ado_Task
              displayName: 'ESRP Release Ado Task'
              variables:
                  - group: 'AME ESRP Variable Group' # Provides: ESRPServiceConnectionName, ESRPAppClientId, ESRPAppTenantId, ESRPKVName, ESRPAuthCertName, ESRPSignCertName
                  - name: ob_release_environment
                    value: Production
              dependsOn: []
              jobs:
                  - job: publish_to_npm
                    templateContext:
                        inputs:
                            - input: pipelineArtifact
                              pipeline: officialBuild
                              artifactName: drop
                    displayName: Publish to NPM
                    pool:
                        type: release
                    steps:
                        - task: EsrpRelease@8
                          displayName: 'Publish to NPM'
                          inputs:
                              connectedservicename: '$(ESRPServiceConnectionName)'
                              keyvaultname: '$(ESRPKVName)'
                              authcertname: '$(ESRPAuthCertName)'
                              signcertname: '$(ESRPSignCertName)'
                              clientid: '$(ESRPAppClientId)'
                              intent: 'packagedistribution'
                              contenttype: 'npm'
                              contentsource: 'Folder'
                              folderlocation: '$(Pipeline.Workspace)/officialBuild/drop'
                              waitforreleasecompletion: true
                              owners: 'aztfai@microsoft.com'
                              approvers: 'aztfai@microsoft.com'
                              serviceendpointurl: 'https://api.esrp.microsoft.com'
                              mainpublisher: 'ESRPRELPACMAN'
                              domaintenantid: '$(ESRPAppTenantId)'
